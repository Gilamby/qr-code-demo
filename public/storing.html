(function(){var T={"en": ["Something is wrong", "QR-Codex is unreachable right now. We know about it and are working on a fix.", "Scanned QR codes may also not open for a moment. As soon as it is fixed, everything works again by itself — you don’t need to do anything.", "We check every 20 seconds whether everything works again.", "Last check: {time}", "It works again! Loading…"], "nl": ["Er is een storing", "QR-Codex is op dit moment niet bereikbaar. We weten ervan en werken aan een oplossing.", "Ook gescande QR-codes openen nu misschien even niet. Zodra het is opgelost, werkt alles vanzelf weer; je hoeft niets te doen.", "We controleren elke 20 seconden of alles weer werkt.", "Laatste controle: {time}", "Het werkt weer! Laden…"], "es": ["Hay una incidencia", "QR-Codex no está disponible en este momento. Lo sabemos y estamos trabajando en una solución.", "Es posible que los códigos QR escaneados tampoco se abran por un momento. En cuanto se solucione, todo volverá a funcionar solo; no tienes que hacer nada.", "Comprobamos cada 20 segundos si todo vuelve a funcionar.", "Última comprobación: {time}", "¡Ya funciona! Cargando…"], "fr": ["Un incident est en cours", "QR-Codex est momentanément inaccessible. Nous sommes au courant et travaillons à une solution.", "Les QR codes scannés peuvent aussi ne pas s’ouvrir pendant un moment. Dès que c’est réglé, tout refonctionne tout seul ; vous n’avez rien à faire.", "Nous vérifions toutes les 20 secondes si tout fonctionne à nouveau.", "Dernière vérification : {time}", "Ça refonctionne ! Chargement…"], "de": ["Es gibt eine Störung", "QR-Codex ist gerade nicht erreichbar. Wir wissen davon und arbeiten an einer Lösung.", "Auch gescannte QR-Codes öffnen sich vielleicht kurz nicht. Sobald es behoben ist, funktioniert alles von selbst wieder – Sie müssen nichts tun.", "Wir prüfen alle 20 Sekunden, ob alles wieder funktioniert.", "Letzte Prüfung: {time}", "Es funktioniert wieder! Lädt…"], "it": ["C’è un disservizio", "QR-Codex al momento non è raggiungibile. Lo sappiamo e stiamo lavorando a una soluzione.", "Anche i QR code scansionati potrebbero non aprirsi per un momento. Appena risolto, tutto tornerà a funzionare da solo: non devi fare nulla.", "Controlliamo ogni 20 secondi se tutto funziona di nuovo.", "Ultimo controllo: {time}", "Funziona di nuovo! Caricamento…"], "pt": ["Há uma falha", "O QR-Codex não está acessível neste momento. Já sabemos e estamos a trabalhar numa solução.", "Os códigos QR lidos também podem não abrir por momentos. Assim que for resolvido, tudo volta a funcionar sozinho; não precisa de fazer nada.", "Verificamos a cada 20 segundos se tudo volta a funcionar.", "Última verificação: {time}", "Já funciona! A carregar…"], "ca": ["Hi ha una incidència", "QR-Codex no està disponible ara mateix. Ho sabem i hi estem treballant.", "És possible que els codis QR escanejats tampoc s’obrin durant una estona. Quan se solucioni, tot tornarà a funcionar sol; no cal que facis res.", "Comprovem cada 20 segons si tot torna a funcionar.", "Última comprovació: {time}", "Ja funciona! Carregant…"], "da": ["Der er en driftsforstyrrelse", "QR-Codex kan ikke nås lige nu. Vi kender til det og arbejder på en løsning.", "Scannede QR-koder åbner måske heller ikke et øjeblik. Så snart det er løst, virker alt af sig selv igen – du skal ikke gøre noget.", "Vi tjekker hvert 20. sekund, om alt virker igen.", "Seneste tjek: {time}", "Det virker igen! Indlæser…"], "sv": ["Det är en störning", "QR-Codex går inte att nå just nu. Vi vet om det och arbetar på en lösning.", "Skannade QR-koder kanske inte heller öppnas en stund. Så fort det är löst fungerar allt av sig själv igen – du behöver inte göra något.", "Vi kontrollerar var 20:e sekund om allt fungerar igen.", "Senaste kontroll: {time}", "Det fungerar igen! Laddar…"], "nb": ["Det er en driftsforstyrrelse", "QR-Codex kan ikke nås akkurat nå. Vi vet om det og jobber med en løsning.", "Skannede QR-koder åpnes kanskje heller ikke en liten stund. Så snart det er løst, fungerer alt av seg selv igjen – du trenger ikke gjøre noe.", "Vi sjekker hvert 20. sekund om alt fungerer igjen.", "Siste sjekk: {time}", "Det fungerer igjen! Laster…"], "fi": ["Palvelussa on häiriö", "QR-Codex ei ole juuri nyt tavoitettavissa. Tiedämme asiasta ja korjaamme sitä.", "Myös skannatut QR-koodit eivät ehkä hetkeen aukea. Kun vika on korjattu, kaikki toimii taas itsestään – sinun ei tarvitse tehdä mitään.", "Tarkistamme 20 sekunnin välein, toimiiko kaikki taas.", "Viimeisin tarkistus: {time}", "Toimii taas! Ladataan…"], "pl": ["Wystąpiła awaria", "QR-Codex jest teraz niedostępny. Wiemy o tym i pracujemy nad rozwiązaniem.", "Zeskanowane kody QR też mogą przez chwilę się nie otwierać. Gdy tylko problem zostanie rozwiązany, wszystko zadziała samo – nie musisz nic robić.", "Co 20 sekund sprawdzamy, czy wszystko znów działa.", "Ostatnie sprawdzenie: {time}", "Znów działa! Ładowanie…"], "ro": ["Există o defecțiune", "QR-Codex nu este accesibil momentan. Știm despre asta și lucrăm la o soluție.", "Este posibil ca nici codurile QR scanate să nu se deschidă o vreme. Imediat ce se rezolvă, totul va funcționa din nou de la sine; nu trebuie să faci nimic.", "Verificăm la fiecare 20 de secunde dacă totul funcționează din nou.", "Ultima verificare: {time}", "Funcționează din nou! Se încarcă…"], "sk": ["Nastala porucha", "QR-Codex momentálne nie je dostupný. Vieme o tom a pracujeme na riešení.", "Ani naskenované QR kódy sa možno chvíľu neotvoria. Hneď ako to bude vyriešené, všetko bude opäť fungovať samo – nemusíte nič robiť.", "Každých 20 sekúnd kontrolujeme, či už všetko funguje.", "Posledná kontrola: {time}", "Už to funguje! Načítava sa…"], "bg": ["Има смущение", "QR-Codex в момента не е достъпен. Знаем за проблема и работим по решение.", "Сканираните QR кодове също може за малко да не се отварят. Щом бъде решено, всичко ще заработи само – не е нужно да правите нищо.", "Проверяваме на всеки 20 секунди дали всичко работи отново.", "Последна проверка: {time}", "Работи отново! Зареждане…"], "el": ["Υπάρχει διακοπή", "Το QR-Codex δεν είναι διαθέσιμο αυτή τη στιγμή. Το γνωρίζουμε και εργαζόμαστε για τη λύση.", "Οι σαρωμένοι κωδικοί QR μπορεί επίσης να μην ανοίγουν για λίγο. Μόλις επιλυθεί, όλα θα λειτουργήσουν ξανά από μόνα τους – δεν χρειάζεται να κάνετε τίποτα.", "Ελέγχουμε κάθε 20 δευτερόλεπτα αν όλα λειτουργούν ξανά.", "Τελευταίος έλεγχος: {time}", "Λειτουργεί ξανά! Φόρτωση…"], "lv": ["Ir traucējums", "QR-Codex pašlaik nav sasniedzams. Mēs par to zinām un strādājam pie risinājuma.", "Arī skenētie QR kodi, iespējams, kādu brīdi neatvērsies. Tiklīdz tas būs novērsts, viss atkal darbosies pats – jums nekas nav jādara.", "Ik pēc 20 sekundēm pārbaudām, vai viss atkal darbojas.", "Pēdējā pārbaude: {time}", "Atkal darbojas! Ielādē…"], "sq": ["Ka një ndërprerje", "QR-Codex nuk është i arritshëm për momentin. E dimë dhe po punojmë për një zgjidhje.", "Edhe kodet QR të skanuara mund të mos hapen për pak kohë. Sapo të zgjidhet, gjithçka do të funksionojë vetë sërish – nuk keni nevojë të bëni asgjë.", "Kontrollojmë çdo 20 sekonda nëse gjithçka funksionon sërish.", "Kontrolli i fundit: {time}", "Funksionon sërish! Po ngarkohet…"]};
