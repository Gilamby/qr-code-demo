<style>:root{color-scheme:dark;--bg:#0b0e13;--panel:#121821;--ink:#e6edf3;--soft:#c3ccd6;--mute:#8b98a8;--line:rgba(255,255,255,.08);--acc:#2bb5f0;--red:#f0566e;--green:#3ccf7a}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;border-top:3px solid var(--red)}
body.ok{border-top-color:var(--green)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}a:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:3px}
header{flex:none;width:100%;max-width:1440px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px;padding:0 32px;}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:700;font-size:16px}.brand:hover{text-decoration:none}.brand img{width:30px;height:30px}
.hd-r{display:flex;align-items:center;gap:22px;font-size:14px}.hd-r span{color:var(--mute)}
main{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-content:start;gap:16px;padding:20px 32px 20px;width:100%;max-width:1440px;margin:0 auto}
@media (min-width:1600px){body{font-size:16px}main{padding-top:32px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;min-width:0}
.status{grid-column:span 2;display:flex;flex-direction:column;justify-content:center}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.state{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}h1{font-size:clamp(26px,3vw,34px);letter-spacing:-.02em;line-height:1.15;margin:0}
.status p{margin:10px 0 0;color:var(--soft);max-width:720px}
h2{font-size:15px;font-weight:700;margin:0 0 12px}
.scan p{margin:0;color:var(--soft)}
table{width:100%;border-collapse:collapse}td{padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--soft)}td+td{text-align:right;white-space:nowrap;padding-left:16px;font-weight:700}
tr:last-child td{border-bottom:0}td.no{color:var(--red)}td.ok{color:var(--green)}
.faq{grid-column:span 2}dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}dt{font-weight:700;margin:0 0 3px}dd{margin:0;color:var(--soft)}
.faq-foot{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
@media (max-width:980px){main{grid-template-columns:1fr;grid-template-rows:none;padding:16px}.status,.faq{grid-column:auto}dl{grid-template-columns:1fr}header{padding:0 16px}.hd-r span{display:none}}</style></head>

<script>
(function(){var T={"nl": ["Storing", "Er is een storing", "QR-Codex is op dit moment niet bereikbaar. We weten ervan en werken aan een oplossing.", "Je hoeft niets te doen: deze pagina controleert elke 20 seconden of alles weer werkt en laadt dan vanzelf opnieuw.", "Laatste controle: {time}", "Het werkt weer! Laden…", "Je scande een QR-code?", "De pagina achter deze QR-code is even niet bereikbaar. Laat dit scherm open: zodra de storing voorbij is, ga je vanzelf door naar de juiste pagina.", "Wat werkt nu wel en wat niet?", "QR-codes die naar een website, menu, coupon, pdf of andere pagina gaan, openen nu niet.", "QR-codes voor wifi en contactgegevens (vCard) werken gewoon: die hebben onze server niet nodig.", "Inloggen en QR-codes maken of aanpassen kan nu niet.", "Scans tijdens de storing worden niet meegeteld in je statistieken.", "Veelgestelde vragen", "Zijn mijn QR-codes of gegevens kwijt?", "Nee. Een storing verwijdert niets: je QR-codes, instellingen en statistieken blijven bewaard.", "Moet ik mijn QR-codes opnieuw maken of printen?", "Nee. Je QR-codes blijven precies hetzelfde. Zodra de storing voorbij is, werken ze weer, ook de codes die al geprint zijn.", "Moet ik zelf iets doen?", "Nee. Je hoeft niets aan te passen of opnieuw in te stellen.", "Hoe lang duurt het?", "Dat weten we nu nog niet precies; we werken eraan om het zo snel mogelijk op te lossen. Na afloop lees je op my.qr-codex.com/status wat er gebeurd is.", "Wat zien mensen die mijn QR-code scannen?", "Deze pagina. Zodra alles weer werkt, gaan ze vanzelf door naar de juiste pagina.", "Nog een vraag? Neem contact op met OptimaSys:", "Storingen en meldingen", "Hier melden we storingen en onderhoud, en houden we je op de hoogte tot alles weer werkt.", "Contact", "QR-codes naar een website, menu, coupon of pdf", "QR-codes voor wifi en contactgegevens", "Inloggen, QR-codes maken en aanpassen", "Scans meetellen in je statistieken", "Werkt", "Werkt niet"], "en": ["Outage", "There is an outage", "QR-Codex is unreachable right now. We know about it and are working on a fix.", "You don’t need to do anything: this page checks every 20 seconds whether everything works again and then reloads by itself.", "Last check: {time}", "It works again! Loading…", "Did you scan a QR code?", "The page behind this QR code is briefly unreachable. Keep this screen open: as soon as the outage is over, you’ll be taken to the right page automatically.", "What works right now and what doesn’t?", "QR codes that lead to a website, menu, coupon, PDF or other page don’t open right now.", "QR codes for Wi-Fi and contact details (vCard) work as usual: they don’t need our server.", "Logging in and creating or editing QR codes isn’t possible right now.", "Scans during the outage are not counted in your statistics.", "Frequently asked questions", "Have I lost my QR codes or data?", "No. An outage deletes nothing: your QR codes, settings and statistics stay saved.", "Do I need to create or print my QR codes again?", "No. Your QR codes stay exactly the same. As soon as the outage is over they work again, including codes that are already printed.", "Do I need to do anything?", "No. You don’t need to change or set up anything again.", "How long will it take?", "We don’t know exactly yet; we’re working to fix it as quickly as possible. Afterwards you can read what happened at my.qr-codex.com/status.", "What do people who scan my QR code see?", "This page. As soon as everything works again, they’re taken to the right page automatically.", "Another question? Contact OptimaSys:", "Outages and notices", "Here we report outages and maintenance and keep you updated until everything works again.", "Contact", "QR codes to a website, menu, coupon or PDF", "QR codes for Wi-Fi and contact details", "Logging in, creating and editing QR codes", "Counting scans in your statistics", "Working", "Not working"], "es": ["Incidencia", "Hay una incidencia", "QR-Codex no está disponible en este momento. Lo sabemos y estamos trabajando en una solución.", "No tienes que hacer nada: esta página comprueba cada 20 segundos si todo vuelve a funcionar y entonces se recarga sola.", "Última comprobación: {time}", "¡Ya funciona! Cargando…", "¿Has escaneado un código QR?", "La página de este código QR no está disponible por un momento. Deja esta pantalla abierta: en cuanto termine la incidencia, irás automáticamente a la página correcta.", "¿Qué funciona ahora y qué no?", "Los códigos QR que llevan a una web, menú, cupón, PDF u otra página no se abren ahora.", "Los códigos QR de wifi y de datos de contacto (vCard) funcionan con normalidad: no necesitan nuestro servidor.", "Ahora no es posible iniciar sesión ni crear o editar códigos QR.", "Los escaneos durante la incidencia no se cuentan en tus estadísticas.", "Preguntas frecuentes", "¿He perdido mis códigos QR o mis datos?", "No. Una incidencia no borra nada: tus códigos QR, ajustes y estadísticas siguen guardados.", "¿Tengo que volver a crear o imprimir mis códigos QR?", "No. Tus códigos QR siguen siendo exactamente los mismos. En cuanto termine la incidencia vuelven a funcionar, también los que ya están impresos.", "¿Tengo que hacer algo?", "No. No tienes que cambiar ni volver a configurar nada.", "¿Cuánto tardará?", "Todavía no lo sabemos con exactitud; trabajamos para solucionarlo lo antes posible. Después podrás leer qué pasó en my.qr-codex.com/status.", "¿Qué ven las personas que escanean mi código QR?", "Esta página. En cuanto todo vuelva a funcionar, irán automáticamente a la página correcta.", "¿Otra pregunta? Contacta con OptimaSys:", "Incidencias y avisos", "Aquí informamos de incidencias y mantenimiento, y te mantenemos al día hasta que todo vuelva a funcionar.", "Contacto", "Códigos QR a una web, menú, cupón o PDF", "Códigos QR de wifi y datos de contacto", "Iniciar sesión, crear y editar códigos QR", "Contar escaneos en tus estadísticas", "Funciona", "No funciona"], "fr": ["Incident", "Un incident est en cours", "QR-Codex est momentanément inaccessible. Nous sommes au courant et travaillons à une solution.", "Vous n’avez rien à faire : cette page vérifie toutes les 20 secondes si tout fonctionne à nouveau, puis se recharge toute seule.", "Dernière vérification : {time}", "Ça refonctionne ! Chargement…", "Vous avez scanné un QR code ?", "La page derrière ce QR code est brièvement inaccessible. Laissez cet écran ouvert : dès la fin de l’incident, vous serez redirigé automatiquement vers la bonne page.", "Qu’est-ce qui fonctionne et qu’est-ce qui ne fonctionne pas ?", "Les QR codes menant à un site, un menu, un coupon, un PDF ou une autre page ne s’ouvrent pas pour le moment.", "Les QR codes Wi-Fi et de coordonnées (vCard) fonctionnent normalement : ils n’ont pas besoin de notre serveur.", "Se connecter et créer ou modifier des QR codes n’est pas possible pour le moment.", "Les scans pendant l’incident ne sont pas comptés dans vos statistiques.", "Questions fréquentes", "Ai-je perdu mes QR codes ou mes données ?", "Non. Un incident ne supprime rien : vos QR codes, réglages et statistiques restent enregistrés.", "Dois-je recréer ou réimprimer mes QR codes ?", "Non. Vos QR codes restent exactement les mêmes. Dès la fin de l’incident, ils fonctionnent à nouveau, y compris ceux déjà imprimés.", "Dois-je faire quelque chose ?", "Non. Vous n’avez rien à modifier ni à reconfigurer.", "Combien de temps cela va-t-il durer ?", "Nous ne le savons pas encore exactement ; nous travaillons à le résoudre au plus vite. Ensuite, vous pourrez lire ce qui s’est passé sur my.qr-codex.com/status.", "Que voient les personnes qui scannent mon QR code ?", "Cette page. Dès que tout refonctionne, elles sont redirigées automatiquement vers la bonne page.", "Une autre question ? Contactez OptimaSys :", "Incidents et annonces", "Nous signalons ici les incidents et la maintenance, et vous tenons informé jusqu’au retour à la normale.", "Contact", "QR codes vers un site, menu, coupon ou PDF", "QR codes Wi-Fi et coordonnées", "Connexion, création et modification de QR codes", "Comptage des scans dans vos statistiques", "Fonctionne", "Ne fonctionne pas"], "de": ["Störung", "Es gibt eine Störung", "QR-Codex ist gerade nicht erreichbar. Wir wissen davon und arbeiten an einer Lösung.", "Sie müssen nichts tun: Diese Seite prüft alle 20 Sekunden, ob alles wieder funktioniert, und lädt dann von selbst neu.", "Letzte Prüfung: {time}", "Es funktioniert wieder! Lädt…", "Sie haben einen QR-Code gescannt?", "Die Seite hinter diesem QR-Code ist kurz nicht erreichbar. Lassen Sie diesen Bildschirm offen: Sobald die Störung vorbei ist, gelangen Sie automatisch zur richtigen Seite.", "Was funktioniert gerade und was nicht?", "QR-Codes, die zu einer Website, Speisekarte, einem Gutschein, PDF oder einer anderen Seite führen, öffnen sich gerade nicht.", "QR-Codes für WLAN und Kontaktdaten (vCard) funktionieren normal: Sie brauchen unseren Server nicht.", "Anmelden und QR-Codes erstellen oder bearbeiten ist gerade nicht möglich.", "Scans während der Störung werden nicht in Ihren Statistiken gezählt.", "Häufige Fragen", "Sind meine QR-Codes oder Daten weg?", "Nein. Eine Störung löscht nichts: Ihre QR-Codes, Einstellungen und Statistiken bleiben gespeichert.", "Muss ich meine QR-Codes neu erstellen oder drucken?", "Nein. Ihre QR-Codes bleiben genau gleich. Sobald die Störung vorbei ist, funktionieren sie wieder, auch bereits gedruckte Codes.", "Muss ich selbst etwas tun?", "Nein. Sie müssen nichts ändern oder neu einrichten.", "Wie lange dauert es?", "Das wissen wir noch nicht genau; wir arbeiten daran, es so schnell wie möglich zu beheben. Danach lesen Sie unter my.qr-codex.com/status, was passiert ist.", "Was sehen Leute, die meinen QR-Code scannen?", "Diese Seite. Sobald alles wieder funktioniert, gelangen sie automatisch zur richtigen Seite.", "Noch eine Frage? Kontaktieren Sie OptimaSys:", "Störungen und Meldungen", "Hier melden wir Störungen und Wartungen und halten Sie auf dem Laufenden, bis alles wieder funktioniert.", "Kontakt", "QR-Codes zu Website, Speisekarte, Gutschein oder PDF", "QR-Codes für WLAN und Kontaktdaten", "Anmelden, QR-Codes erstellen und bearbeiten", "Scans in Ihren Statistiken zählen", "Funktioniert", "Funktioniert nicht"], "it": ["Disservizio", "C’è un disservizio", "QR-Codex al momento non è raggiungibile. Lo sappiamo e stiamo lavorando a una soluzione.", "Non devi fare nulla: questa pagina controlla ogni 20 secondi se tutto funziona di nuovo e poi si ricarica da sola.", "Ultimo controllo: {time}", "Funziona di nuovo! Caricamento…", "Hai scansionato un QR code?", "La pagina di questo QR code non è raggiungibile per un momento. Lascia aperta questa schermata: appena il disservizio finisce, verrai portato automaticamente alla pagina giusta.", "Cosa funziona ora e cosa no?", "I QR code che portano a un sito, menu, coupon, PDF o altra pagina al momento non si aprono.", "I QR code per Wi-Fi e contatti (vCard) funzionano normalmente: non hanno bisogno del nostro server.", "Al momento non è possibile accedere né creare o modificare QR code.", "Le scansioni durante il disservizio non vengono conteggiate nelle tue statistiche.", "Domande frequenti", "Ho perso i miei QR code o i miei dati?", "No. Un disservizio non cancella nulla: QR code, impostazioni e statistiche restano salvati.", "Devo ricreare o ristampare i miei QR code?", "No. I tuoi QR code restano esattamente gli stessi. Appena il disservizio finisce funzionano di nuovo, anche quelli già stampati.", "Devo fare qualcosa?", "No. Non devi modificare né riconfigurare nulla.", "Quanto durerà?", "Non lo sappiamo ancora con esattezza; stiamo lavorando per risolvere il prima possibile. Dopo potrai leggere cosa è successo su my.qr-codex.com/status.", "Cosa vede chi scansiona il mio QR code?", "Questa pagina. Appena tutto funziona di nuovo, viene portato automaticamente alla pagina giusta.", "Un’altra domanda? Contatta OptimaSys:", "Disservizi e avvisi", "Qui segnaliamo disservizi e manutenzioni e ti teniamo aggiornato finché tutto torna a funzionare.", "Contatti", "QR code verso sito, menu, coupon o PDF", "QR code per Wi-Fi e contatti", "Accesso, creazione e modifica dei QR code", "Conteggio delle scansioni nelle statistiche", "Funziona", "Non funziona"], "pt": ["Falha", "Há uma falha", "O QR-Codex não está acessível neste momento. Já sabemos e estamos a trabalhar numa solução.", "Não precisa de fazer nada: esta página verifica a cada 20 segundos se tudo voltou a funcionar e depois recarrega sozinha.", "Última verificação: {time}", "Já funciona! A carregar…", "Leu um código QR?", "A página deste código QR não está acessível por momentos. Mantenha este ecrã aberto: assim que a falha terminar, será levado automaticamente para a página certa.", "O que funciona agora e o que não funciona?", "Os códigos QR que levam a um site, menu, cupão, PDF ou outra página não abrem neste momento.", "Os códigos QR de Wi-Fi e de contactos (vCard) funcionam normalmente: não precisam do nosso servidor.", "Neste momento não é possível iniciar sessão nem criar ou editar códigos QR.", "As leituras durante a falha não são contadas nas suas estatísticas.", "Perguntas frequentes", "Perdi os meus códigos QR ou dados?", "Não. Uma falha não apaga nada: os seus códigos QR, definições e estatísticas continuam guardados.", "Tenho de voltar a criar ou imprimir os meus códigos QR?", "Não. Os seus códigos QR ficam exatamente iguais. Assim que a falha terminar voltam a funcionar, incluindo os já impressos.", "Tenho de fazer alguma coisa?", "Não. Não precisa de alterar nem configurar nada de novo.", "Quanto tempo vai demorar?", "Ainda não sabemos exatamente; estamos a trabalhar para resolver o mais depressa possível. Depois pode ler o que aconteceu em my.qr-codex.com/status.", "O que veem as pessoas que leem o meu código QR?", "Esta página. Assim que tudo voltar a funcionar, são levadas automaticamente para a página certa.", "Outra pergunta? Contacte a OptimaSys:", "Falhas e avisos", "Aqui comunicamos falhas e manutenção e mantemo-lo informado até tudo voltar a funcionar.", "Contacto", "Códigos QR para site, menu, cupão ou PDF", "Códigos QR de Wi-Fi e contactos", "Iniciar sessão, criar e editar códigos QR", "Contar leituras nas suas estatísticas", "Funciona", "Não funciona"], "ca": ["Incidència", "Hi ha una incidència", "QR-Codex no està disponible ara mateix. Ho sabem i hi estem treballant.", "No cal que facis res: aquesta pàgina comprova cada 20 segons si tot torna a funcionar i aleshores es recarrega sola.", "Última comprovació: {time}", "Ja funciona! Carregant…", "Has escanejat un codi QR?", "La pàgina d’aquest codi QR no està disponible per un moment. Deixa aquesta pantalla oberta: quan acabi la incidència, aniràs automàticament a la pàgina correcta.", "Què funciona ara i què no?", "Els codis QR que porten a un web, menú, cupó, PDF o una altra pàgina ara no s’obren.", "Els codis QR de wifi i de contacte (vCard) funcionen amb normalitat: no necessiten el nostre servidor.", "Ara no és possible iniciar sessió ni crear o editar codis QR.", "Els escanejos durant la incidència no es compten a les teves estadístiques.", "Preguntes freqüents", "He perdut els meus codis QR o dades?", "No. Una incidència no esborra res: els teus codis QR, configuració i estadístiques continuen desats.", "He de tornar a crear o imprimir els meus codis QR?", "No. Els teus codis QR continuen exactament iguals. Quan acabi la incidència tornen a funcionar, també els que ja estan impresos.", "He de fer alguna cosa?", "No. No cal canviar ni tornar a configurar res.", "Quant de temps trigarà?", "Encara no ho sabem exactament; treballem per solucionar-ho com més aviat millor. Després podràs llegir què ha passat a my.qr-codex.com/status.", "Què veuen les persones que escanegen el meu codi QR?", "Aquesta pàgina. Quan tot torni a funcionar, aniran automàticament a la pàgina correcta.", "Una altra pregunta? Contacta amb OptimaSys:", "Incidències i avisos", "Aquí informem d’incidències i manteniment, i et mantenim al dia fins que tot torni a funcionar.", "Contacte", "Codis QR a un web, menú, cupó o PDF", "Codis QR de wifi i dades de contacte", "Iniciar sessió, crear i editar codis QR", "Comptar escanejos a les estadístiques", "Funciona", "No funciona"], "da": ["Driftsforstyrrelse", "Der er en driftsforstyrrelse", "QR-Codex kan ikke nås lige nu. Vi kender til det og arbejder på en løsning.", "Du skal ikke gøre noget: siden tjekker hvert 20. sekund, om alt virker igen, og genindlæses så af sig selv.", "Seneste tjek: {time}", "Det virker igen! Indlæser…", "Har du scannet en QR-kode?", "Siden bag denne QR-kode kan ikke nås lige nu. Lad skærmen være åben: så snart forstyrrelsen er ovre, kommer du automatisk til den rigtige side.", "Hvad virker lige nu, og hvad gør ikke?", "QR-koder, der fører til et website, en menu, kupon, PDF eller anden side, åbner ikke lige nu.", "QR-koder til wi-fi og kontaktoplysninger (vCard) virker som normalt: de har ikke brug for vores server.", "Det er ikke muligt at logge ind eller oprette eller redigere QR-koder lige nu.", "Scanninger under forstyrrelsen tælles ikke med i din statistik.", "Ofte stillede spørgsmål", "Har jeg mistet mine QR-koder eller data?", "Nej. En driftsforstyrrelse sletter intet: dine QR-koder, indstillinger og statistik er stadig gemt.", "Skal jeg lave eller printe mine QR-koder igen?", "Nej. Dine QR-koder forbliver præcis de samme. Så snart forstyrrelsen er ovre, virker de igen, også dem der allerede er printet.", "Skal jeg selv gøre noget?", "Nej. Du behøver ikke ændre eller indstille noget igen.", "Hvor lang tid tager det?", "Det ved vi ikke præcist endnu; vi arbejder på at løse det hurtigst muligt. Bagefter kan du læse, hvad der skete, på my.qr-codex.com/status.", "Hvad ser folk, der scanner min QR-kode?", "Denne side. Så snart alt virker igen, kommer de automatisk til den rigtige side.", "Har du et andet spørgsmål? Kontakt OptimaSys:", "Driftsforstyrrelser og meddelelser", "Her melder vi driftsforstyrrelser og vedligeholdelse og holder dig opdateret, indtil alt virker igen.", "Kontakt", "QR-koder til website, menu, kupon eller PDF", "QR-koder til wi-fi og kontaktoplysninger", "Log ind, opret og rediger QR-koder", "Tælle scanninger i din statistik", "Virker", "Virker ikke"], "sv": ["Störning", "Det är en störning", "QR-Codex går inte att nå just nu. Vi vet om det och arbetar på en lösning.", "Du behöver inte göra något: sidan kontrollerar var 20:e sekund om allt fungerar igen och laddas sedan om av sig själv.", "Senaste kontroll: {time}", "Det fungerar igen! Laddar…", "Skannade du en QR-kod?", "Sidan bakom den här QR-koden går inte att nå just nu. Låt skärmen vara öppen: så fort störningen är över kommer du automatiskt till rätt sida.", "Vad fungerar just nu och vad fungerar inte?", "QR-koder som leder till en webbplats, meny, kupong, PDF eller annan sida öppnas inte just nu.", "QR-koder för wifi och kontaktuppgifter (vCard) fungerar som vanligt: de behöver inte vår server.", "Det går inte att logga in eller skapa eller ändra QR-koder just nu.", "Skanningar under störningen räknas inte i din statistik.", "Vanliga frågor", "Har jag förlorat mina QR-koder eller data?", "Nej. En störning raderar ingenting: dina QR-koder, inställningar och statistik finns kvar.", "Måste jag skapa eller skriva ut mina QR-koder igen?", "Nej. Dina QR-koder är exakt desamma. Så fort störningen är över fungerar de igen, även koder som redan är utskrivna.", "Måste jag göra något själv?", "Nej. Du behöver inte ändra eller ställa in något på nytt.", "Hur lång tid tar det?", "Det vet vi inte exakt än; vi arbetar för att lösa det så snabbt som möjligt. Efteråt kan du läsa vad som hände på my.qr-codex.com/status.", "Vad ser de som skannar min QR-kod?", "Den här sidan. Så fort allt fungerar igen kommer de automatiskt till rätt sida.", "Har du en annan fråga? Kontakta OptimaSys:", "Störningar och meddelanden", "Här rapporterar vi störningar och underhåll och håller dig uppdaterad tills allt fungerar igen.", "Kontakt", "QR-koder till webbplats, meny, kupong eller PDF", "QR-koder för wifi och kontaktuppgifter", "Logga in, skapa och ändra QR-koder", "Räkna skanningar i din statistik", "Fungerar", "Fungerar inte"], "nb": ["Driftsforstyrrelse", "Det er en driftsforstyrrelse", "QR-Codex kan ikke nås akkurat nå. Vi vet om det og jobber med en løsning.", "Du trenger ikke gjøre noe: siden sjekker hvert 20. sekund om alt fungerer igjen, og lastes så inn på nytt av seg selv.", "Siste sjekk: {time}", "Det fungerer igjen! Laster…", "Skannet du en QR-kode?", "Siden bak denne QR-koden kan ikke nås akkurat nå. La skjermen stå åpen: så snart forstyrrelsen er over, kommer du automatisk til riktig side.", "Hva fungerer nå, og hva gjør ikke?", "QR-koder som går til et nettsted, en meny, kupong, PDF eller annen side, åpnes ikke nå.", "QR-koder for wifi og kontaktinformasjon (vCard) fungerer som vanlig: de trenger ikke serveren vår.", "Det er ikke mulig å logge inn eller lage eller endre QR-koder nå.", "Skanninger under forstyrrelsen telles ikke med i statistikken din.", "Ofte stilte spørsmål", "Har jeg mistet QR-kodene eller dataene mine?", "Nei. En driftsforstyrrelse sletter ingenting: QR-kodene, innstillingene og statistikken din er fortsatt lagret.", "Må jeg lage eller skrive ut QR-kodene mine på nytt?", "Nei. QR-kodene dine forblir nøyaktig de samme. Så snart forstyrrelsen er over, fungerer de igjen, også koder som allerede er skrevet ut.", "Må jeg gjøre noe selv?", "Nei. Du trenger ikke endre eller sette opp noe på nytt.", "Hvor lang tid tar det?", "Det vet vi ikke nøyaktig ennå; vi jobber for å løse det så raskt som mulig. Etterpå kan du lese hva som skjedde på my.qr-codex.com/status.", "Hva ser folk som skanner QR-koden min?", "Denne siden. Så snart alt fungerer igjen, kommer de automatisk til riktig side.", "Et annet spørsmål? Kontakt OptimaSys:", "Driftsforstyrrelser og meldinger", "Her melder vi driftsforstyrrelser og vedlikehold og holder deg oppdatert til alt fungerer igjen.", "Kontakt", "QR-koder til nettsted, meny, kupong eller PDF", "QR-koder for wifi og kontaktinformasjon", "Logge inn, lage og endre QR-koder", "Telle skanninger i statistikken", "Fungerer", "Fungerer ikke"], "fi": ["Häiriö", "Palvelussa on häiriö", "QR-Codex ei ole juuri nyt tavoitettavissa. Tiedämme asiasta ja korjaamme sitä.", "Sinun ei tarvitse tehdä mitään: sivu tarkistaa 20 sekunnin välein, toimiiko kaikki taas, ja latautuu sitten itsestään uudelleen.", "Viimeisin tarkistus: {time}", "Toimii taas! Ladataan…", "Skannasitko QR-koodin?", "Tämän QR-koodin takana oleva sivu ei ole hetkeen tavoitettavissa. Pidä tämä näkymä auki: kun häiriö on ohi, siirryt automaattisesti oikealle sivulle.", "Mikä toimii nyt ja mikä ei?", "QR-koodit, jotka vievät verkkosivulle, ruokalistaan, kuponkiin, PDF:ään tai muulle sivulle, eivät nyt aukea.", "Wi-Fi- ja yhteystieto-QR-koodit (vCard) toimivat normaalisti: ne eivät tarvitse palvelintamme.", "Kirjautuminen sekä QR-koodien luominen tai muokkaaminen ei nyt onnistu.", "Häiriön aikaisia skannauksia ei lasketa tilastoihisi.", "Usein kysyttyä", "Ovatko QR-koodini tai tietoni kadonneet?", "Eivät. Häiriö ei poista mitään: QR-koodisi, asetuksesi ja tilastosi säilyvät tallessa.", "Pitääkö QR-koodit luoda tai tulostaa uudelleen?", "Ei. QR-koodisi pysyvät täsmälleen samoina. Kun häiriö on ohi, ne toimivat taas, myös jo tulostetut koodit.", "Pitääkö minun tehdä jotain?", "Ei. Sinun ei tarvitse muuttaa tai määrittää mitään uudelleen.", "Kauanko tämä kestää?", "Emme vielä tiedä tarkasti; teemme töitä korjataksemme sen mahdollisimman nopeasti. Jälkikäteen voit lukea tapahtuneesta osoitteessa my.qr-codex.com/status.", "Mitä QR-koodini skannaajat näkevät?", "Tämän sivun. Kun kaikki toimii taas, he siirtyvät automaattisesti oikealle sivulle.", "Onko sinulla muuta kysyttävää? Ota yhteyttä OptimaSysiin:", "Häiriöt ja tiedotteet", "Kerromme täällä häiriöistä ja huolloista ja pidämme sinut ajan tasalla, kunnes kaikki toimii taas.", "Yhteystiedot", "Q
