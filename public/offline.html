<style>
:root{--bg:#050b17;--panel:#1b2335;--line:rgba(255,255,255,.1);--text:#eef3fb;--mute:#8d9bb3;--acc:#3aa8f0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background-image:radial-gradient(ellipse 80% 50% at 50% 100%,rgba(30,90,170,.35),transparent 70%),radial-gradient(rgba(58,168,240,.28) 1.2px,transparent 1.6px);background-size:100% 100%,26px 26px;min-height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:22px 28px;font-weight:700;letter-spacing:-.01em}
.top a{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}.logo{width:34px;height:34px;display:block}.top b span{color:var(--acc)}
main{max-width:860px;margin:0 auto;padding:6px 20px 40px;text-align:center}
h1{font-size:clamp(72px,14vw,132px);line-height:.95;margin:6px 0 10px;font-weight:800;letter-spacing:-.045em;background:linear-gradient(180deg,#fff,#7fb8ea);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(18px,3vw,26px);font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.sub2{color:var(--mute);margin:0 auto 26px;max-width:560px;line-height:1.5}
html[data-offline] h1{font-size:clamp(30px,5.5vw,46px);letter-spacing:-.03em;line-height:1.1;margin:16px 0 10px}html[data-offline] .sub{display:none}
.card{position:relative;padding:14px;border-radius:30px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(70,82,105,.55),rgba(24,31,48,.8));box-shadow:0 30px 80px rgba(0,0,0,.5)}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#0b1830;line-height:0;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
canvas{width:100%;height:auto;aspect-ratio:640/240;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;line-height:1.3;background:rgba(4,10,22,.45);z-index:2;text-align:center;padding:10px}
.ov.hide{display:none}
.ov h2{margin:0;font-size:clamp(22px,4.5vw,34px);letter-spacing:-.03em;font-weight:800}
.ov p{margin:0;color:#b9c7dc;font-size:clamp(12px,2vw,15px)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 22px;background:var(--acc);color:#04223a;cursor:pointer;box-shadow:0 6px 24px rgba(58,168,240,.35);transition:transform .08s}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid #fff;outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;padding:0 4px;color:var(--mute);font-size:14px}
.keys{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
kbd{font:inherit;font-weight:700;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:8px;padding:3px 9px}
.chip{font:inherit;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.home{display:inline-block;margin-top:26px;text-decoration:none}.home[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
