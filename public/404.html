c.font='bold 12px ui-monospace,Menlo,monospace';c.fillStyle='#8fb2d8';c.fillText('Best '+String(best).padStart(6,'0'),W-18,60);
if(banner>0){c.textAlign='center';c.font='bold 26px ui-monospace,Menlo,monospace';c.fillStyle=(banner>>2)&1?'#fff':th.acc;c.fillText(bannerTxt,W/2,92)}
if(flash>0){c.fillStyle='rgba(255,255,255,'+flash/28+')';c.fillRect(0,0,W,H)}
if(level===3&&state==='play'){c.fillStyle='rgba(255,84,112,.06)';c.fillRect(0,(T*3)%H,W,14)}}
// loop
let last=performance.now(),acc=0;function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=16.667){step();acc-=16.667}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
// input
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(!e.repeat){holding=true;act()}}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){holding=false;if(p.vy<-4)p.vy*=.45}});
const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{if(e.target===ovB)return;e.preventDefault();holding=true;act()});
addEventListener('pointerup',()=>{holding=false;if(p.vy<-4)p.vy*=.45});
ovB.addEventListener('click',()=>{if(state==='idle'){start();jump()}else if(state==='dead')start()});
ovB.addEventListener('keydown',e=>{if(e.code==='Space')e.stopPropagation()});
sndB.addEventListener('click',()=>{snd=!snd;sndB.textContent=snd?tx('soundOn','Sound on'):tx('soundOff','Sound off');sndB.blur()});
})();
</script>
