# nginx site for Optimasys QR behind Cloudflare.
# Install: /etc/nginx/sites-available/optimasys-qr  (+ symlink in sites-enabled), then: nginx -t && systemctl reload nginx
# Replace qr.example.com with the real domain (the same value as PUBLIC_URL in .env).

# --- Real visitor IP from Cloudflare --------------------------------------------------------
# Needed for scan statistics (country/city) and login rate limits. Without this, every visitor
# looks like a Cloudflare server. Keep the list up to date: https://www.cloudflare.com/ips/
# (Many teams keep this block in a shared /etc/nginx/conf.d/cloudflare.conf instead.)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name qr.example.com;
    return 301 https://$host$request_uri;
}

server {
    # "listen … ssl http2" works on every nginx version (on 1.25.1+ you may use "http2 on;" instead)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qr.example.com;

    # Cloudflare Origin Certificate (or any certificate valid for the domain)
    ssl_certificate     /etc/ssl/cloudflare/qr.example.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/qr.example.com.key;

    # Uploads: logos and PDF/MP3 files (the app itself allows up to 16 MB per request)
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # $remote_addr is the real visitor IP here (see real_ip_header above).
        # Overwrite, don't append: the app must not trust anything the visitor sends itself.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
